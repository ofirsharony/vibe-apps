<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>מירוץ מכוניות תלת-ממד — Vibe Apps</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --glass: rgba(8, 12, 30, 0.62);
      --glass-border: rgba(255, 255, 255, 0.16);
      --text: #f8fafc;
      --dim: rgba(248, 250, 252, 0.72);
      --accent: #f59e0b;
      --accent2: #22c55e;
      --accent3: #38bdf8;
      --radius: 20px;
    }
    html, body { height: 100%; overflow: hidden; background: #0b1020; font-family: 'Rubik', sans-serif; color: var(--text); user-select: none; -webkit-user-select: none; touch-action: none; }
    canvas#gl { position: fixed; inset: 0; display: block; }

    .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 20px; z-index: 10; }
    .hidden { display: none !important; }

    /* ---------- showroom ---------- */
    #showroom { pointer-events: none; justify-content: space-between; padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom)); }
    #showroom > * { pointer-events: auto; }
    .title { text-align: center; }
    .title h1 { font-size: clamp(30px, 6vw, 56px); font-weight: 900; letter-spacing: -1px; background: linear-gradient(90deg, #fde047, #fb923c, #f472b6); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; filter: drop-shadow(0 4px 18px rgba(251,146,60,.35)); }
    .title p { color: var(--dim); font-size: 20px; margin-top: 4px; }

    .picker { width: min(960px, 100%); background: var(--glass); border: 1px solid var(--glass-border); border-radius: var(--radius); backdrop-filter: blur(16px); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .car-name { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .car-name h2 { font-size: 30px; font-weight: 900; }
    .stats { display: flex; gap: 14px; flex-wrap: wrap; }
    .stat { display: flex; align-items: center; gap: 8px; font-size: 18px; color: var(--dim); }
    .bar { width: 90px; height: 10px; border-radius: 6px; background: rgba(255,255,255,.12); overflow: hidden; }
    .bar i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, #22c55e, #fde047); }

    .swatches { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px; }
    .swatch { min-height: 72px; border-radius: 16px; border: 3px solid transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 18px; font-weight: 700; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.6); transition: transform .15s, border-color .15s; }
    .swatch span.em { font-size: 26px; }
    .swatch:hover { transform: translateY(-3px); }
    .swatch.active { border-color: #fff; transform: scale(1.06); box-shadow: 0 0 0 4px rgba(255,255,255,.25), 0 12px 30px rgba(0,0,0,.4); }

    .tracks { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
    .track { border-radius: 14px; padding: 10px 12px; background: rgba(255,255,255,.06); border: 2px solid transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; transition: transform .15s, border-color .15s, background .15s; min-height: 48px; }
    .track .em { font-size: 26px; }
    .track b { font-size: 17px; }
    .track .stars { font-size: 12px; letter-spacing: -2px; }
    .track small { font-size: 13px; color: var(--dim); line-height: 1.25; }
    .track:hover { transform: translateY(-2px); background: rgba(255,255,255,.1); }
    .track.active { border-color: var(--accent); background: rgba(245,158,11,.16); }
    .btn { border: none; cursor: pointer; font-family: inherit; font-weight: 900; font-size: 24px; padding: 16px 38px; border-radius: 999px; color: #1a1200; background: linear-gradient(135deg, #fde047, #fb923c); box-shadow: 0 10px 30px rgba(251,146,60,.45); transition: transform .12s, box-shadow .12s; min-height: 56px; }
    .btn:hover { transform: translateY(-2px) scale(1.03); }
    .btn:active { transform: scale(.97); }
    .btn.secondary { background: rgba(255,255,255,.14); color: #fff; box-shadow: none; border: 1px solid var(--glass-border); font-size: 20px; }
    .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

    /* ---------- HUD ---------- */
    #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
    .panel { position: absolute; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 16px; backdrop-filter: blur(12px); padding: 10px 16px; font-weight: 700; font-size: 20px; }
    #posPanel { top: max(14px, env(safe-area-inset-top)); right: 14px; text-align: center; min-width: 110px; }
    #posPanel .big { font-size: 46px; font-weight: 900; line-height: 1; color: var(--accent); }
    #posPanel .small { font-size: 15px; color: var(--dim); }
    #lapPanel { top: max(14px, env(safe-area-inset-top)); left: 14px; text-align: center; }
    #lapPanel .big { font-size: 30px; font-weight: 900; }
    #timePanel { top: max(14px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); font-variant-numeric: tabular-nums; }
    #speedPanel { bottom: max(14px, env(safe-area-inset-bottom)); left: 14px; text-align: center; }
    #speedPanel .big { font-size: 40px; font-weight: 900; line-height: 1; }
    #speedPanel .small { font-size: 14px; color: var(--dim); }
    #nitroPanel { bottom: max(14px, env(safe-area-inset-bottom)); right: 14px; width: 160px; }
    #nitroPanel .bar { width: 100%; height: 14px; margin-top: 6px; }
    #nitroPanel .bar i { background: linear-gradient(90deg, #38bdf8, #a78bfa); transition: width .1s; }
    #nitroPanel .small { font-size: 14px; color: var(--dim); }
    #countdown { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: clamp(90px, 22vw, 200px); font-weight: 900; color: #fff; text-shadow: 0 0 40px rgba(253,224,71,.8), 0 8px 20px rgba(0,0,0,.6); }
    #toast { position: absolute; top: 24%; left: 50%; transform: translateX(-50%); font-size: clamp(28px, 6vw, 54px); font-weight: 900; color: #fde047; text-shadow: 0 6px 20px rgba(0,0,0,.6); opacity: 0; transition: opacity .3s; white-space: nowrap; }
    #toast.show { opacity: 1; }
    #minimap { position: absolute; bottom: max(90px, calc(env(safe-area-inset-bottom) + 90px)); right: 14px; width: 150px; height: 150px; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 16px; }

    /* ---------- touch controls ---------- */
    #touch { position: fixed; inset: 0; pointer-events: none; z-index: 6; display: none; }
    body.touch #touch { display: block; }
    .tbtn { position: absolute; pointer-events: auto; width: 84px; height: 84px; border-radius: 50%; background: rgba(255,255,255,.14); border: 2px solid rgba(255,255,255,.35); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; font-size: 36px; color: #fff; }
    .tbtn:active, .tbtn.on { background: rgba(253,224,71,.5); }
    #tLeft  { left: 18px;  bottom: calc(110px + env(safe-area-inset-bottom)); }
    #tRight { left: 116px; bottom: calc(110px + env(safe-area-inset-bottom)); }
    #tGas   { right: 18px; bottom: calc(200px + env(safe-area-inset-bottom)); width: 96px; height: 96px; }
    #tBrake { right: 128px; bottom: calc(200px + env(safe-area-inset-bottom)); }
    #tNitro { right: 18px; bottom: calc(310px + env(safe-area-inset-bottom)); font-size: 30px; }

    /* ---------- results ---------- */
    #results { background: rgba(5, 8, 22, .55); }
    .card { background: var(--glass); border: 1px solid var(--glass-border); border-radius: var(--radius); backdrop-filter: blur(16px); padding: 28px 30px; width: min(520px, 100%); text-align: center; display: flex; flex-direction: column; gap: 16px; }
    .card h2 { font-size: clamp(34px, 7vw, 54px); font-weight: 900; }
    .card .sub { color: var(--dim); font-size: 22px; }
    .board { display: flex; flex-direction: column; gap: 8px; }
    .rowb { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 12px; background: rgba(255,255,255,.06); font-size: 20px; font-weight: 700; }
    .rowb.me { background: rgba(253,224,71,.18); outline: 2px solid rgba(253,224,71,.5); }
    .rowb .dot { width: 22px; height: 22px; border-radius: 6px; flex: none; }
    .rowb .n { width: 34px; text-align: center; font-weight: 900; }
    .rowb .nm { flex: 1; text-align: right; }
    .rowb .t { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 17px; }

    .hint { color: var(--dim); font-size: 16px; text-align: center; }
    kbd { background: rgba(255,255,255,.14); border-radius: 6px; padding: 1px 8px; font-family: inherit; font-weight: 700; }

    @media (max-width: 640px) {
      .picker { padding: 12px; gap: 10px; }
      .car-name h2 { font-size: 24px; }
      .swatch { min-height: 60px; font-size: 15px; }
      .swatch span.em { font-size: 22px; }
      #minimap { width: 110px; height: 110px; bottom: calc(410px + env(safe-area-inset-bottom)); }
      #nitroPanel { width: 120px; }
      .stat .bar { width: 60px; }
      .tracks { grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .track small { display: none; }
      .track b { font-size: 14px; }
      .track .em { font-size: 20px; }
    }
  </style>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <canvas id="gl"></canvas>

  <!-- ===== SHOWROOM ===== -->
  <section id="showroom" class="screen">
    <div class="title">
      <h1>🏁 מירוץ מכוניות תלת-ממד</h1>
      <p>בחרו מכונית, לחצו על הגז ותנצחו את כל היריבים!</p>
    </div>
    <div class="picker">
      <div class="car-name">
        <h2 id="carName">—</h2>
        <div class="stats">
          <div class="stat">מהירות <div class="bar"><i id="stSpeed"></i></div></div>
          <div class="stat">היגוי <div class="bar"><i id="stHandle"></i></div></div>
          <div class="stat">ניטרו <div class="bar"><i id="stNitro"></i></div></div>
        </div>
      </div>
      <div class="swatches" id="swatches"></div>
      <div class="tracks" id="tracks"></div>
      <div class="row">
        <button class="btn" id="startBtn">🚦 להתחיל מירוץ</button>
        <button class="btn secondary" id="lapsBtn">🔁 3 הקפות</button>
      </div>
      <div class="hint">מקשי חצים / <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> לנהיגה · <kbd>רווח</kbd> לניטרו · <kbd>Esc</kbd> לתפריט · בטלפון: כפתורים על המסך</div>
    </div>
  </section>

  <!-- ===== HUD ===== -->
  <div id="hud" class="hidden">
    <div class="panel" id="posPanel"><div class="big" id="posNum">6</div><div class="small">מקום מתוך <span id="posOf">6</span></div></div>
    <div class="panel" id="lapPanel"><div class="small">הקפה</div><div class="big"><span id="lapNum">1</span>/<span id="lapOf">3</span></div></div>
    <div class="panel" id="timePanel"><span id="timeTxt">0:00.0</span></div>
    <div class="panel" id="speedPanel"><div class="big" id="speedNum">0</div><div class="small">קמ״ש</div></div>
    <div class="panel" id="nitroPanel"><div class="small">⚡ ניטרו (רווח)</div><div class="bar"><i id="nitroBar" style="width:100%"></i></div></div>
    <canvas id="minimap" width="300" height="300"></canvas>
    <div id="countdown"></div>
    <div id="toast"></div>
  </div>

  <div id="touch">
    <div class="tbtn" id="tLeft">⬅️</div>
    <div class="tbtn" id="tRight">➡️</div>
    <div class="tbtn" id="tBrake">🛑</div>
    <div class="tbtn" id="tGas">⛽</div>
    <div class="tbtn" id="tNitro">⚡</div>
  </div>

  <!-- ===== RESULTS ===== -->
  <section id="results" class="screen hidden">
    <div class="card">
      <h2 id="resTitle">🏆 ניצחתם!</h2>
      <div class="sub" id="resSub"></div>
      <div class="board" id="board"></div>
      <div class="row">
        <button class="btn" id="againBtn">🔁 שחק שוב</button>
        <button class="btn secondary" id="garageBtn">🚗 החלפת מכונית</button>
      </div>
    </div>
  </section>

  <script type="module">
    import * as THREE from 'three';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    /* =========================================================
       CAR CATALOG
       ========================================================= */
    const CARS = [
      { id: 'red',    name: 'הברק האדום',      color: 0xe11d48, emoji: '🔴', shape: 'sport',   speed: 1.00, handling: 0.80, nitro: 0.90 },
      { id: 'green',  name: 'הצפרדע הירוקה',   color: 0x22c55e, emoji: '🟢', shape: 'buggy',   speed: 0.88, handling: 1.00, nitro: 0.80 },
      { id: 'yellow', name: 'הצרעה הצהובה',    color: 0xfacc15, emoji: '🟡', shape: 'formula', speed: 1.05, handling: 0.75, nitro: 0.85 },
      { id: 'purple', name: 'הסגולה הקסומה',   color: 0x9333ea, emoji: '🟣', shape: 'muscle',  speed: 0.95, handling: 0.85, nitro: 1.00 },
      { id: 'brown',  name: 'הדוב החום',       color: 0x92400e, emoji: '🟤', shape: 'pickup',  speed: 0.82, handling: 0.90, nitro: 0.75, aiOnly: true },
      { id: 'blue',   name: 'הכריש הכחול',     color: 0x2563eb, emoji: '🔵', shape: 'sport',   speed: 0.97, handling: 0.88, nitro: 0.85 },
      { id: 'orange', name: 'התפוז המהיר',     color: 0xf97316, emoji: '🟠', shape: 'hatch',   speed: 0.90, handling: 0.95, nitro: 0.80 },
      { id: 'pink',   name: 'הוורודה הזוהרת',  color: 0xec4899, emoji: '🩷', shape: 'van',     speed: 0.85, handling: 0.85, nitro: 0.95, aiOnly: true },
      { id: 'white',  name: 'הרוח הלבנה',      color: 0xf1f5f9, emoji: '⚪', shape: 'formula', speed: 1.02, handling: 0.82, nitro: 0.85 },
      { id: 'black',  name: 'הפנתר השחור',     color: 0x111827, emoji: '⚫', shape: 'muscle',  speed: 0.98, handling: 0.80, nitro: 0.95 },
    ];
    const AI_NAMES = ['רוני', 'דנה', 'יובל', 'נועה', 'איתי', 'מאיה', 'עומר', 'שירה', 'טל'];

    /* =========================================================
       AUDIO (Web Audio API only)
       ========================================================= */
    let actx = null, engineOsc = null, engineGain = null;
    function audio() { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); return actx; }
    function beep(freq, dur = 0.12, type = 'square', vol = 0.15) {
      try {
        const a = audio(), o = a.createOscillator(), g = a.createGain();
        o.type = type; o.frequency.value = freq; g.gain.value = vol;
        g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
        o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + dur);
      } catch (e) {}
    }
    function fanfare() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.3, 'triangle', 0.2), i * 140)); }
    function startEngine() {
      try {
        const a = audio();
        engineOsc = a.createOscillator(); engineGain = a.createGain();
        engineOsc.type = 'sawtooth'; engineOsc.frequency.value = 60; engineGain.gain.value = 0;
        const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
        engineOsc.connect(lp).connect(engineGain).connect(a.destination); engineOsc.start();
      } catch (e) {}
    }
    function stopEngine() { try { engineGain.gain.setTargetAtTime(0, actx.currentTime, 0.1); engineOsc.stop(actx.currentTime + 0.3); } catch (e) {} engineOsc = null; }
    function setEngine(speedRatio, on) {
      if (!engineOsc) return;
      engineOsc.frequency.setTargetAtTime(50 + speedRatio * 170, actx.currentTime, 0.05);
      engineGain.gain.setTargetAtTime(on ? 0.05 + speedRatio * 0.05 : 0, actx.currentTime, 0.05);
    }

    /* =========================================================
       THREE SETUP
       ========================================================= */
    const canvas = document.getElementById('gl');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    const pmrem = new THREE.PMREMGenerator(renderer);
    const envMap = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    const scene = new THREE.Scene();
    scene.environment = envMap;
    scene.background = new THREE.Color(0x7ec8ff);
    scene.fog = new THREE.Fog(0x9fd8ff, 180, 520);
    const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 1200);

    const hemi = new THREE.HemisphereLight(0xdff3ff, 0x4a7a2a, 0.9); scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xfff4d6, 1.6);
    sun.position.set(120, 180, 60); sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = sun.shadow.camera.bottom = -90;
    sun.shadow.camera.right = sun.shadow.camera.top = 90;
    sun.shadow.camera.far = 500; sun.shadow.bias = -0.0005;
    scene.add(sun); scene.add(sun.target);

    // Sky dome with gradient (uniforms are re-colored per track)
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, fog: false,
      uniforms: { top: { value: new THREE.Color(0x2f7fe0) }, bot: { value: new THREE.Color(0xbfe7ff) } },
      vertexShader: 'varying vec3 p; void main(){ p = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
      fragmentShader: 'uniform vec3 top; uniform vec3 bot; varying vec3 p; void main(){ float h = clamp(normalize(p).y*1.6, 0., 1.); gl_FragColor = vec4(mix(bot, top, h), 1.); }'
    });
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(900, 32, 16), skyMat));
    const sunDisc = new THREE.Mesh(new THREE.SphereGeometry(18, 16, 16), new THREE.MeshBasicMaterial({ color: 0xfff7c2, fog: false })); sunDisc.position.set(400, 300, 200); scene.add(sunDisc);
    // Clouds
    const clouds = new THREE.Group(); scene.add(clouds);
    const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff, emissive: 0x334455, fog: false });
    for (let i = 0; i < 26; i++) {
      const grp = new THREE.Group();
      for (let j = 0; j < 4; j++) { const c = new THREE.Mesh(new THREE.SphereGeometry(8 + Math.random() * 10, 10, 8), cloudMat); c.position.set(j * 10 - 15, Math.random() * 4, Math.random() * 6); grp.add(c); }
      const a = Math.random() * Math.PI * 2, r = 250 + Math.random() * 350;
      grp.position.set(Math.cos(a) * r, 110 + Math.random() * 60, Math.sin(a) * r);
      clouds.add(grp);
    }
    // Stars (night tracks)
    const stars = (() => { const n = 900, pos = new Float32Array(n * 3); for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, e = Math.random() * Math.PI * 0.48 + 0.05, r = 850; pos[i * 3] = Math.cos(a) * Math.cos(e) * r; pos[i * 3 + 1] = Math.sin(e) * r; pos[i * 3 + 2] = Math.sin(a) * Math.cos(e) * r; } const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); const m = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 2.4, fog: false, sizeAttenuation: false })); m.visible = false; scene.add(m); return m; })();
    // Ground
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x5fae3f });
    const ground = new THREE.Mesh(new THREE.CircleGeometry(900, 64), groundMat);
    ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

    /* =========================================================
       TRACKS
       ========================================================= */
    let ROAD_HALF = 9;
    let hazards = [];   // { s, lat, r, type } on-road features: slow | ice | lava | boost
    const SAMPLES = 700;
    let TRACK_LEN = 1, samplePts = [], sampleTan = [], sampleNrm = [];
    const world = new THREE.Group(); scene.add(world);   // everything track-specific lives here
    let balloons = [], embers = null, water = null;

    function poseAt(s, lateral, out) {
      const f = ((s % TRACK_LEN) + TRACK_LEN) % TRACK_LEN / TRACK_LEN * SAMPLES;
      const i = Math.floor(f) % SAMPLES, j = (i + 1) % SAMPLES, k = f - Math.floor(f);
      out.pos.lerpVectors(samplePts[i], samplePts[j], k);
      out.tan.lerpVectors(sampleTan[i], sampleTan[j], k).normalize();
      out.nrm.set(-out.tan.z, 0, out.tan.x);
      out.pos.addScaledVector(out.nrm, lateral);
      out.curv = sampleTan[(i + 6) % SAMPLES].clone().cross(sampleTan[i]).y;
      return out;
    }
    function makePose() { return { pos: new THREE.Vector3(), tan: new THREE.Vector3(), nrm: new THREE.Vector3(), curv: 0 }; }
    const tmpPose = makePose();

    function ribbon(halfInner, halfOuter, color, y = 0.02, tex = null) {
      const pos = [], idx = [], uv = [];

          add(rb(1.9, 0.6, 0.06, 0.03), glass, 0, 1.95, -2.15);
          add(rb(2.2, 0.08, 3.4, 0.03), paint2, 0, 2.47, -0.3);                            // roof
          add(rb(0.9, 0.3, 0.7, 0.1), chrome, 0, 2.66, -0.9);                               // roof box
          add(rb(0.3, 0.05, 4.0, 0.02), stripe, 0, 1.24, 0.0);
          [-1, 1].forEach(s => add(rb(1.6, 0.08, 0.05, 0.02), stripe, s * 1.1, 1.3, -0.5)); // side stripe
          grille(1.8, 0.9, 2.28); mirrors(1.1, 1.75, 1.6); exhaust(0.6, 0.4, -2.3, 0.1);
          numberY = 2.52; numberZ = 0.6;

      }

      const tail = new THREE.MeshStandardMaterial({ color: 0xff2020, emissive: 0xff2a2a, emissiveIntensity: 1.6 });
      if (def.shape !== 'formula') [-1, 1].forEach(s => { add(rb(0.45, 0.24, 0.12, 0.06), head, s * 0.68, 0.75, frontZ + 0.02); add(rb(0.5, 0.18, 0.12, 0.05), tail, s * 0.7, 0.75, backZ - 0.02); });
      else add(rb(0.5, 0.15, 0.1, 0.04), tail, 0, 0.78, backZ);

      num.castShadow = false;
      // Wheels with spoked rims and brake discs

      const tireM = new THREE.MeshStandardMaterial({ color: 0x0f1115, roughness: 0.9 });
      const rimM = new THREE.MeshStandardMaterial({ color: 0xe5e7eb, metalness: 1, roughness: 0.15 });
      const discM = new THREE.MeshStandardMaterial({ color: 0x6b7280, metalness: 0.8, roughness: 0.4 });
      wheelPos.forEach(([x, y, z, r = 0.46, w = 0.42]) => {

        const tire = new THREE.Mesh(new THREE.TorusGeometry(r * 0.7, r * 0.32, 12, 24), tireM); tire.scale.x = (w / (r * 0.64)); tire.rotation.y = Math.PI / 2; tire.castShadow = true; grp.add(tire);
        const disc = new THREE.Mesh(cyl(r * 0.5, r * 0.5, w * 0.5, 20), discM); disc.rotation.z = Math.PI / 2; grp.add(disc);
        for (let i = 0; i < 6; i++) { const sp = new THREE.Mesh(new THREE.BoxGeometry(w * 1.02, r * 0.16, r * 1.1), rimM); sp.rotation.x = i * Math.PI / 6; grp.add(sp); }
        const hub = new THREE.Mesh(cyl(r * 0.2, r * 0.2, w * 1.06, 12), rimM); hub.rotation.z = Math.PI / 2; grp.add(hub);
        grp.position.set(x, y, z); g.add(grp); wheels.push(grp);
      });
      // Soft shadow blob under the car
      const blob = new THREE.Mesh(new THREE.CircleGeometry(1, 24), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.28, depthWrite: false }));
      blob.rotation.x = -Math.PI / 2; blob.position.y = 0.03; blob.scale.set(1.3, 2.4, 1); g.add(blob);
      // Nitro flame

      flame.rotation.x = Math.PI / 2; flame.position.set(0, 0.5, backZ - 1.0); flame.visible = false; g.add(flame);
      const flame2 = new THREE.Mesh(new THREE.ConeGeometry(0.2, 1.2, 8), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 }));
      flame2.position.z = -0.1; flame.add(flame2);

        const head = new THREE.Mesh(new THREE.SphereGeometry(0.26, 12, 10), new THREE.MeshPhysicalMaterial({ color: isLight ? 0xef4444 : 0xfacc15, clearcoat: 1, roughness: 0.2 }));
        head.position.set(def.shape === 'buggy' ? 0 : 0.4, dy, def.shape === 'buggy' ? -0.2 : 0.1); g.add(head);
      }

    }

    /* =========================================================
       SHOWROOM
       ========================================================= */
    const showroom = document.getElementById('showroom');
    const hud = document.getElementById('hud');
    const results = document.getElementById('results');
    let selected = 0, totalLaps = 3;
    const showGroup = new THREE.Group(); scene.add(showGroup);
    let showCar = null;
    const swatches = document.getElementById('swatches');
    CARS.forEach((c, i) => {
      if (c.aiOnly) return; // brown and pink only race as opponents
      const d = document.createElement('div'); d.className = 'swatch'; d.dataset.idx = i;
      d.style.background = `#${c.color.toString(16).padStart(6, '0')}`;

    });
    function selectCar(i) {

      document.getElementById('carName').textContent = `${c.emoji} ${c.name}`;

      document.getElementById('stHandle').style.width = (c.handling * 95) + '%';
      document.getElementById('stNitro').style.width = (c.nitro * 95) + '%';

      showCar = buildCar(c); showGroup.add(showCar);
    }
    function placeShowroom() { const sp = makePose(); poseAt(22, 0, sp); showGroup.position.copy(sp.pos); showGroup.rotation.y = Math.atan2(sp.tan.x, sp.tan.z); }
    selectCar(0);
    buildTrack(TRACKS[0]);
    // Track picker
    const tracksEl = document.getElementById('tracks');
    TRACKS.forEach((t, i) => {
      const d = document.createElement('div'); d.className = 'track' + (i === 0 ? ' active' : '');
      d.innerHTML = `<span class="em">${t.emoji}</span><b>${t.name}</b><span class="stars">${'⭐'.repeat(t.stars)}</span><small>${t.desc}</small>`;
      d.onclick = () => { [...tracksEl.children].forEach((el, j) => el.classList.toggle('active', j === i)); buildTrack(t); beep(720, 0.08, 'triangle'); };
      tracksEl.appendChild(d);
    });

    document.getElementById('lapsBtn').onclick = e => { totalLaps = totalLaps === 3 ? 5 : totalLaps === 5 ? 1 : 3; e.target.textContent = `🔁 ${totalLaps === 1 ? 'הקפה אחת' : totalLaps + ' הקפות'}`; beep(520, 0.08, 'triangle'); };
    document.getElementById('startBtn').onclick = () => { audio(); startRace(); };
    document.getElementById('againBtn').onclick = () => { audio(); startRace(); };
    document.getElementById('garageBtn').onclick = () => { toGarage(); };

    /* =========================================================
       RACE STATE
       ========================================================= */
    const NUM_AI = 5;
    let racers = [];        // { def, mesh, s, lat, speed, lap, finished, finishTime, ai, targetLat, aiBoost, name, wheelSpin, nitro, nitroOn }
    let player = null;
    let phase = 'garage';   // garage | countdown | racing | finished
    let raceTime = 0, countdownT = 0, finishedCount = 0;
    const keys = {};
    const touchState = { left: false, right: false, gas: false, brake: false, nitro: false };
    const BASE_SPEED = 48; // m/s at speed=1

    function clearRacers() { racers.forEach(r => scene.remove(r.mesh)); racers = []; }

    function startRace() {
      clearRacers(); showGroup.visible = false;
      showroom.classList.add('hidden'); results.classList.add('hidden'); hud.classList.remove('hidden');
      // choose AI cars (distinct from player)
      const pool = CARS.filter((_, i) => i !== selected).sort(() => Math.random() - 0.5).slice(0, NUM_AI);
      const lineup = [CARS[selected], ...pool];
      const names = AI_NAMES.slice().sort(() => Math.random() - 0.5);
      lineup.forEach((def, i) => {
        const mesh = buildCar(def); scene.add(mesh);
        const row = Math.floor(i / 2), col = i % 2 ? 1 : -1;
        const r = { def, mesh, s: -8 - row * 7, lat: col * Math.min(4, ROAD_HALF - 2.2), speed: 0, lap: 1, finished: false, finishTime: 0,
          ai: i > 0, targetLat: col * 3, aiSkill: currentTrack.aiSkill - 0.05 + Math.random() * 0.1, aiTimer: 0, name: i === 0 ? 'אתם' : names[i - 1],
          wheelSpin: 0, nitro: 1, nitroOn: false, latVel: 0, tilt: 0, lastLapS: -1, slip: 0, hazardCd: 0, boostT: 0 };
        racers.push(r);
      });
      player = racers[0];
      phase = 'countdown'; countdownT = 3.999; raceTime = 0; finishedCount = 0;
      document.getElementById('posOf').textContent = racers.length;
      document.getElementById('lapOf').textContent = totalLaps;
      document.getElementById('lapNum').textContent = 1;
      startEngine();
      snapCamera();
    }

    function toGarage() {
      phase = 'garage'; clearRacers(); stopEngine();
      hud.classList.add('hidden'); results.classList.add('hidden'); showroom.classList.remove('hidden');
      showGroup.visible = true;
    }

    /* =========================================================
       INPUT
       ========================================================= */
    addEventListener('keydown', e => { if (e.code === 'Escape' && phase !== 'garage') { e.preventDefault(); Object.keys(keys).forEach(k => keys[k] = false); toGarage(); return; } keys[e.code] = true; if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault(); });
    addEventListener('keyup', e => { keys[e.code] = false; });
    const isTouch = matchMedia('(pointer: coarse)').matches;
    if (isTouch) document.body.classList.add('touch');
    [['tLeft', 'left'], ['tRight', 'right'], ['tGas', 'gas'], ['tBrake', 'brake'], ['tNitro', 'nitro']].forEach(([id, k]) => {
      const el = document.getElementById(id);
      const on = e => { e.preventDefault(); touchState[k] = true; el.classList.add('on'); audio(); };
      const off = e => { e.preventDefault(); touchState[k] = false; el.classList.remove('on'); };
      el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off); el.addEventListener('pointerleave', off); el.addEventListener('pointercancel', off);
    });
    const input = () => ({
      gas: keys.ArrowUp || keys.KeyW || touchState.gas,
      brake: keys.ArrowDown || keys.KeyS || touchState.brake,
      left: keys.ArrowLeft || keys.KeyA || touchState.left,
      right: keys.ArrowRight || keys.KeyD || touchState.right,
      nitro: keys.Space || touchState.nitro
    });

    /* =========================================================
       HUD helpers
       ========================================================= */
    const toastEl = document.getElementById('toast'); let toastTimer = 0;
    function toast(msg, ms = 1400) { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms); }
    function fmt(t) { const m = Math.floor(t / 60), s = t - m * 60; return `${m}:${s.toFixed(1).padStart(4, '0')}`; }
    const ordinal = ['', 'ראשון 🥇', 'שני 🥈', 'שלישי 🥉', 'רביעי', 'חמישי', 'שישי'];

    // Minimap
    const mm = document.getElementById('minimap'), mx = mm.getContext('2d');
    function mmXY(p) { const pad = 24, w = 300 - pad * 2; const sx = w / (bounds.maxX - bounds.minX), sz = w / (bounds.maxZ - bounds.minZ), sc = Math.min(sx, sz); const ox = (w - (bounds.maxX - bounds.minX) * sc) / 2, oz = (w - (bounds.maxZ - bounds.minZ) * sc) / 2; return [pad + ox + (p.x - bounds.minX) * sc, pad + oz + (p.z - bounds.minZ) * sc]; }
    function drawMinimap() {
      mx.clearRect(0, 0, 300, 300);
      mx.lineWidth = 12; mx.strokeStyle = 'rgba(255,255,255,.35)'; mx.lineCap = 'round'; mx.beginPath();
      for (let i = 0; i <= SAMPLES; i += 4) { const [x, y] = mmXY(samplePts[i % SAMPLES]); i ? mx.lineTo(x, y) : mx.moveTo(x, y); }
      mx.stroke();
      racers.forEach(r => { const [x, y] = mmXY(r.mesh.position); mx.beginPath(); mx.arc(x, y, r === player ? 9 : 6, 0, Math.PI * 2); mx.fillStyle = '#' + r.def.color.toString(16).padStart(6, '0'); mx.fill(); mx.lineWidth = 2; mx.strokeStyle = '#fff'; mx.stroke(); });
    }

    /* =========================================================
       SIMULATION
       ========================================================= */
    const pose = makePose();
    function progress(r) { return (r.lap - 1) * TRACK_LEN + ((r.s % TRACK_LEN) + TRACK_LEN) % TRACK_LEN; }

    function updateRacer(r, dt) {
      const maxSpeed = BASE_SPEED * r.def.speed * (r.ai ? r.aiSkill : 1);
      let gas = false, brake = false, steer = 0, nitro = false;
      if (phase === 'racing' && !r.finished) {
        if (r.ai) {
          gas = true;
          r.aiTimer -= dt;
          if (r.aiTimer <= 0) { r.aiTimer = 1.5 + Math.random() * 2.5; r.targetLat = (Math.random() - 0.5) * (ROAD_HALF * 1.3); }
          // Corner: cut inside a little
          poseAt(r.s + 20, 0, pose);
          if (Math.abs(pose.curv) > 0.05) r.targetLat = THREE.MathUtils.clamp(r.targetLat + Math.sign(pose.curv) * 2.5 * dt, -ROAD_HALF + 1, ROAD_HALF - 1);
          // Avoid hazards ahead, steer onto boost pads
          hazards.forEach(h => { const ds = ((h.s - r.s) % TRACK_LEN + TRACK_LEN) % TRACK_LEN; if (ds < 30 && Math.abs(h.lat - r.targetLat) < h.r + 1.2) { if (h.type === 'boost') r.targetLat = h.lat; else r.targetLat = THREE.MathUtils.clamp(h.lat + (r.targetLat >= h.lat ? 1 : -1) * (h.r + 1.8), -ROAD_HALF + 1.2, ROAD_HALF - 1.2); } });
          // Avoid car ahead
          racers.forEach(o => { if (o !== r) { const ds = ((o.s - r.s) % TRACK_LEN + TRACK_LEN) % TRACK_LEN; if (ds < 12 && ds > 0 && Math.abs(o.lat - r.lat) < 2.2) r.targetLat = o.lat > 0 ? o.lat - 4 : o.lat + 4; } });
          steer = THREE.MathUtils.clamp((r.targetLat - r.lat) * 0.6, -1, 1);
          // Rubber banding: faster if behind player, slower if far ahead
          const gap = progress(player) - progress(r);
          r.rubber = THREE.MathUtils.clamp(1 + gap / 400, 0.86, 1.14);
          nitro = r.nitro > 0.3 && Math.random() < 0.004 && gap > 20;
          if (nitro) r.nitroOn = true;
          if (r.nitroOn && r.nitro > 0) nitro = true; else r.nitroOn = false;
        } else {
          const inp = input(); gas = inp.gas; brake = inp.brake; steer = (inp.right ? 1 : 0) - (inp.left ? 1 : 0); nitro = inp.nitro && r.nitro > 0.02;
          if (isTouch && !gas && !brake) gas = true; // phones: auto-throttle
        }
      } else if (phase === 'finished' || r.finished) {
        gas = true; steer = THREE.MathUtils.clamp((0 - r.lat) * 0.4, -1, 1);
      }
      // Speed
      const boost = (nitro ? 1.35 : 1) * (r.boostT > 0 ? 1.3 : 1);
      const target = gas ? maxSpeed * boost * (r.rubber || 1) * (r.finished ? 0.6 : 1) : 0;
      const accel = (gas ? 22 : 12) * (nitro ? 1.6 : 1) * (r.boostT > 0 ? 2 : 1);
      r.boostT = Math.max(0, r.boostT - dt); r.hazardCd = Math.max(0, r.hazardCd - dt);
      if (brake) r.speed = Math.max(0, r.speed - 40 * dt);
      else if (r.speed < target) r.speed = Math.min(target, r.speed + accel * dt);
      else r.speed = Math.max(target, r.speed - (gas ? 30 : 14) * dt);
      // Nitro tank
      if (nitro) r.nitro = Math.max(0, r.nitro - dt / (4 * r.def.nitro)); else r.nitro = Math.min(1, r.nitro + dt / 14);
      r.mesh.userData.flame.visible = (nitro || r.boostT > 0) && r.speed > 5;
      r.mesh.userData.flame.material.color.set(r.boostT > 0 && !nitro ? 0x86efac : 0x67e8f9);
      // Corner grip: exceed corner speed -> slide & slow
      poseAt(r.s, 0, pose);
      const cornerLimit = maxSpeed * (1.15 - Math.min(Math.abs(pose.curv), 0.5) * 0.9) * (0.9 + 0.2 * r.def.handling) * currentTrack.corner;
      if (r.speed > cornerLimit && !nitro) r.speed -= (r.speed - cornerLimit) * 2.5 * dt;
      // Steering
      // Grip model: low grip (ice, sand) makes the car respond late and keep sliding; slip from an ice patch makes it worse for a moment
      const steerRate = (6.1 + 5.2 * r.def.handling) * Math.min(1, r.speed / 12);
      r.slip = Math.max(0, r.slip - dt);
      const grip = THREE.MathUtils.clamp(currentTrack.grip * (r.slip > 0 ? 0.25 : 1), 0.1, 1);
      r.latVel = THREE.MathUtils.lerp(r.latVel, steer * steerRate, Math.min(1, (2 + 14 * grip) * dt));
      r.lat += r.latVel * dt;
      // Hazards on the road
      hazards.forEach(h => {
        let ds = r.s - h.s; ds = ((ds + TRACK_LEN / 2) % TRACK_LEN + TRACK_LEN) % TRACK_LEN - TRACK_LEN / 2;
        if (Math.abs(ds) > h.r * 1.6 || Math.abs(r.lat - h.lat) > h.r) return;
        if (h.type === 'boost') { if (r.boostT <= 0) { r.boostT = 1.6; if (!r.ai) { beep(1320, 0.18, 'triangle', 0.2); toast('🚀 בוסט!', 700); } } }
        else if (h.type === 'ice') { r.slip = 0.9; }
        else if (r.hazardCd <= 0) { r.hazardCd = 1.2; r.speed *= h.type === 'lava' ? 0.5 : 0.62; if (h.type === 'lava') r.nitro = Math.max(0, r.nitro - 0.3); if (!r.ai) { beep(150, 0.25, 'sawtooth', 0.15); toast(h.type === 'lava' ? '🔥 לבה!' : '💥 אופס!', 700); } }
      });
      // Edges
      const edge = ROAD_HALF - 0.9;
      if (Math.abs(r.lat) > edge) { r.lat = Math.sign(r.lat) * edge; r.speed *= 1 - 1.5 * dt; if (!r.ai && r.speed > 15 && Math.random() < 0.1) beep(120, 0.05, 'sawtooth', 0.08); }
      if (Math.abs(r.lat) > edge) r.latVel *= 0.3;
      r.tilt = THREE.MathUtils.lerp(r.tilt, -steer * 0.12 * Math.min(1, r.speed / 30), 8 * dt);
      // Advance
      const prevS = r.s;
      r.s += r.speed * dt;
      // Lap crossing
      if (prevS < r.lap * TRACK_LEN && r.s >= r.lap * TRACK_LEN && !r.finished && phase === 'racing') {
        if (r.lap >= totalLaps) {
          r.finished = true; r.finishTime = raceTime; finishedCount++;
          if (r === player) onPlayerFinish();
        } else {
          r.lap++;
          if (r === player) { document.getElementById('lapNum').textContent = r.lap; toast(r.lap === totalLaps ? '🏁 הקפה אחרונה!' : `הקפה ${r.lap}!`); beep(880, 0.15, 'triangle', 0.2); }
        }
      }
      // Collisions between cars
      racers.forEach(o => {
        if (o === r) return;
        let ds = r.s - o.s; ds = ((ds + TRACK_LEN / 2) % TRACK_LEN + TRACK_LEN) % TRACK_LEN - TRACK_LEN / 2;
        const dl = r.lat - o.lat;
        if (Math.abs(ds) < 4.4 && Math.abs(dl) < 2.2) {
          const push = (2.2 - Math.abs(dl)) * 0.5;
          r.lat += Math.sign(dl || 1) * push; o.lat -= Math.sign(dl || 1) * push;
          if (ds < 0) { r.speed = Math.min(r.speed, o.speed * 0.92); } else { o.speed = Math.min(o.speed, r.speed * 0.92); }
          if ((r === player || o === player) && Math.random() < 0.3) beep(200, 0.06, 'square', 0.07);
        }
      });
      // Place mesh
      poseAt(r.s, r.lat, pose);
      r.mesh.position.copy(pose.pos);
      const yaw = Math.atan2(pose.tan.x, pose.tan.z);
      r.mesh.rotation.set(0, yaw - (r.latVel / Math.max(8, r.speed)) * 1.2 - steer * 0.1 * Math.min(1, r.speed / 20), r.tilt);
      r.wheelSpin += r.speed * dt / 0.45;
      r.mesh.userData.wheels.forEach((w, i) => { w.rotation.x = r.wheelSpin; if (i < 2) w.rotation.y = steer * 0.4; });
      r.mesh.userData.flame.scale.setScalar(0.8 + Math.random() * 0.5);
    }

    function onPlayerFinish() {
      const rank = racers.filter(r => r.finished).length; // player's finishing order
      player.rank = rank;
      phase = 'finished';
      fanfare();
      toast(rank === 1 ? '🏆 ניצחתם!!!' : `סיימתם במקום ${ordinal[rank].split(' ')[0]}!`, 2500);
      spawnConfetti(rank === 1 ? 260 : 100);
      setTimeout(showResults, 2600);
    }

    function showResults() {
      // Finish the rest by projected time
      const order = racers.slice().sort((a, b) => (a.finished && b.finished) ? a.finishTime - b.finishTime : a.finished ? -1 : b.finished ? 1 : progress(b) - progress(a));
      const rank = order.indexOf(player) + 1;
      document.getElementById('resTitle').textContent = rank === 1 ? '🏆 ניצחתם!' : rank <= 3 ? '🎉 עלייה לפודיום!' : '👏 כל הכבוד!';
      document.getElementById('resSub').textContent = `${currentTrack.emoji} ${currentTrack.name} · סיימתם במקום ה${ordinal[rank].split(' ')[0]} · זמן ${fmt(player.finishTime)}`;
      const board = document.getElementById('board'); board.innerHTML = '';
      order.forEach((r, i) => {
        const d = document.createElement('div'); d.className = 'rowb' + (r === player ? ' me' : '');
        d.innerHTML = `<span class="n">${i + 1}</span><span class="dot" style="background:#${r.def.color.toString(16).padStart(6, '0')}"></span><span class="nm">${r.def.emoji} ${r.name} · ${r.def.name}</span><span class="t">${r.finished ? fmt(r.finishTime) : 'עוד רגע…'}</span>`;
        board.appendChild(d);
      });
      results.classList.remove('hidden');
    }

    /* =========================================================
       CONFETTI
       ========================================================= */
    const confetti = [];
    const confMat = [0xef4444, 0xfacc15, 0x3b82f6, 0xa855f7, 0x22c55e, 0xf97316, 0xffffff].map(c => new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide }));
    const confGeo = new THREE.PlaneGeometry(0.5, 0.5);
    function spawnConfetti(n) {
      for (let i = 0; i < n; i++) {
        const m = new THREE.Mesh(confGeo, confMat[i % confMat.length]);
        m.position.copy(player.mesh.position).add(new THREE.Vector3((Math.random() - 0.5) * 30, 12 + Math.random() * 10, (Math.random() - 0.5) * 30));
        m.userData.v = new THREE.Vector3((Math.random() - 0.5) * 6, -2 - Math.random() * 3, (Math.random() - 0.5) * 6);
        m.userData.rot = new THREE.Vector3(Math.random() * 4, Math.random() * 4, Math.random() * 4);
        m.userData.life = 5; scene.add(m); confetti.push(m);
      }
    }
    function updateConfetti(dt) {
      for (let i = confetti.length - 1; i >= 0; i--) {
        const c = confetti[i]; c.userData.life -= dt; c.position.addScaledVector(c.userData.v, dt);
        c.rotation.x += c.userData.rot.x * dt; c.rotation.y += c.userData.rot.y * dt; c.rotation.z += c.userData.rot.z * dt;
        if (c.userData.life <= 0 || c.position.y < 0) { scene.remove(c); confetti.splice(i, 1); }
      }
    }

    /* =========================================================
       CAMERA
       ========================================================= */
    const camTarget = new THREE.Vector3(), camPos = new THREE.Vector3();
    let showAngle = 0, camLat = 0, camBack = 8;
    function snapCamera() {
      if (!player) return;
      poseAt(player.s - 12, player.lat * 0.5, pose);
      camera.position.copy(pose.pos).add(new THREE.Vector3(0, 6, 0));
      camera.lookAt(player.mesh.position);
    }
    function updateCamera(dt) {
      if (phase === 'garage') {
        showAngle += dt * 0.5;
        const r = 11;
        camera.position.set(showGroup.position.x + Math.cos(showAngle) * r, 4.5 + Math.sin(showAngle * 0.7) * 0.8, showGroup.position.z + Math.sin(showAngle) * r);
        camera.lookAt(showGroup.position.x, 1, showGroup.position.z);
        if (showCar) showCar.userData.wheels.forEach(w => w.rotation.x += dt * 4);
        return;
      }
      const speedRatio = player.speed / BASE_SPEED;
      const back = 7.5 + speedRatio * 2.5, up = 3.0 + speedRatio * 0.8;
      camLat = THREE.MathUtils.lerp(camLat, player.lat * 0.6, 1 - Math.pow(0.02, dt));
      camBack = THREE.MathUtils.lerp(camBack, back, 1 - Math.pow(0.05, dt));
      poseAt(player.s - camBack, camLat, pose);
      camera.position.copy(pose.pos).setY(up);
      poseAt(player.s + 7, player.lat * 0.5, pose);
      camTarget.copy(pose.pos).setY(1.2);
      camera.lookAt(camTarget);
      camera.fov = THREE.MathUtils.lerp(camera.fov, 58 + speedRatio * 12 + (player.mesh.userData.flame.visible ? 8 : 0), 4 * dt);
      camera.updateProjectionMatrix();
      // Sun follows player for nice shadows
      sun.position.copy(player.mesh.position).add(new THREE.Vector3(80, 140, 40)); sun.target.position.copy(player.mesh.position);
    }

    /* =========================================================
       MAIN LOOP
       ========================================================= */
    function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
    addEventListener('resize', resize); resize();

    const cdEl = document.getElementById('countdown');
    let lastCd = -1;
    const clock = new THREE.Clock();
    function frame() {
      requestAnimationFrame(frame);
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.elapsedTime;
      balloons.forEach(b => { b.position.y = b.userData.baseY + Math.sin(t * 0.6 + b.userData.ph) * 3; b.rotation.y += dt * 0.1; });
      if (embers) { const a = embers.geometry.attributes.position; for (let i = 0; i < a.count; i++) { let y = a.getY(i) + dt * (4 + (i % 5)); if (y > 60) y = 0; a.setY(i, y); a.setX(i, a.getX(i) + Math.sin(t + i) * dt * 2); } a.needsUpdate = true; }
      if (water) water.position.y = -0.4 + Math.sin(t * 0.8) * 0.15;

      if (phase === 'countdown') {
        countdownT -= dt;
        const n = Math.ceil(countdownT);
        if (n !== lastCd) { lastCd = n; if (n > 0) { cdEl.textContent = n; beep(440, 0.15, 'square', 0.2); } else { cdEl.textContent = 'סעו!'; beep(880, 0.4, 'square', 0.25); phase = 'racing'; setTimeout(() => cdEl.textContent = '', 900); } }
        racers.forEach(r => { r.mesh.userData.wheels.forEach(w => w.rotation.x += dt * 2); poseAt(r.s, r.lat, pose); r.mesh.position.copy(pose.pos); r.mesh.rotation.y = Math.atan2(pose.tan.x, pose.tan.z); });
      }
      if (phase === 'racing' || phase === 'finished') {
        if (phase === 'racing') raceTime += dt;
        racers.forEach(r => updateRacer(r, dt));
        // Position
        const order = racers.slice().sort((a, b) => (a.finished && b.finished) ? a.finishTime - b.finishTime : a.finished ? -1 : b.finished ? 1 : progress(b) - progress(a));
        const pos = order.indexOf(player) + 1;
        document.getElementById('posNum').textContent = pos;
        document.getElementById('timeTxt').textContent = fmt(phase === 'racing' ? raceTime : player.finishTime);
        document.getElementById('speedNum').textContent = Math.round(player.speed * 3.6);
        document.getElementById('nitroBar').style.width = (player.nitro * 100) + '%';
        setEngine(player.speed / (BASE_SPEED * 1.35), true);
        drawMinimap();
        // Crowd cheering wave
        scene.traverse(o => { if (o.userData.crowd) o.position.y = o.userData.baseY + Math.abs(Math.sin(t * 6 + o.position.x)) * 0.35; });
      }
      updateConfetti(dt);
      updateCamera(dt);
      renderer.render(scene, camera);
    }
    frame();
  </script>
</body>
</html>
